<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森林標準地調査 入力アプリ v3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#1d2b22;font-family:system-ui,sans-serif}header{background:#234d3b;color:white;padding:16px;position:sticky;top:0}h1{font-size:18px;margin:0}main{max-width:760px;margin:auto;padding:12px}.card{background:white;border:1px solid #d5e0d7;border-radius:13px;padding:14px;margin-bottom:12px}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd6ce;border-radius:8px;background:white;font:inherit;min-height:40px}.species{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.species label,.checks label{display:flex;align-items:center;gap:4px;border:1px solid #d5e0d7;border-radius:7px;padding:7px 4px;font-weight:500}input[type=radio],input[type=checkbox]{width:17px;height:17px;min-height:17px}.tree{border:1px solid #d5e0d7;border-radius:10px;padding:11px;margin:10px 0;background:#fcfdfc}.treehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.checks{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.checks label{font-size:12px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo{border:1px solid #d5e0d7;border-radius:9px;padding:10px}.photo button,button{border:0;border-radius:8px;padding:10px;font:inherit;font-weight:650;background:#234d3b;color:white}.photo button{width:100%}.secondary{background:#eef5ef;color:#234d3b;border:1px solid #cbdacf}.danger{background:#fff0ed;color:#8e2b1c}.fname,.status,.hint{font-size:12px;color:#65736a;overflow-wrap:anywhere}.status{margin-top:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{width:100%}@media(max-width:420px){.grid{gap:7px}.card{padding:11px}.species{gap:3px}.species label{font-size:11px;padding:6px 2px}}
</style></head><body><header><h1>森林標準地調査 入力アプリ（試作 v3）</h1></header><main>
<section class="card"><h2>1. プロット基本情報</h2><div class="grid"><div><label>プロット番号</label><input id="plotId" placeholder="例：390410"></div><div><label>調査日時</label><input id="date" type="datetime-local"></div><div><label>緯度</label><input id="lat"></div><div><label>経度</label><input id="lon"></div><div class="field" style="grid-column:1/-1"><label>メモ</label><textarea id="memo"></textarea></div></div></section>
<section class="card"><h2>2. プロット写真</h2><div class="photos" id="photoGrid"></div><p class="hint">撮影ボタンから撮影または画像を選択すると、用途に応じたファイル名を表示します。</p></section>
<section class="card"><h2>3. 林内環境</h2><div class="grid" id="env"></div></section>
<section class="card"><h2>4. 代表樹木（12本）</h2><p class="hint">樹種・胸高直径・樹高・生枝下高などを入力します。</p><div id="reps"></div></section>
<section class="card"><h2>5. 全ての樹木</h2><div id="trees"></div><button class="secondary" id="add" type="button">＋ 樹木を追加</button></section>
<section class="card"><h2>6. 保存・書き出し</h2><div class="actions"><button id="save">この端末に保存</button><button class="secondary" id="export">入力データを書き出す</button></div><p class="status" id="status">入力内容は保存ボタンで端末内に保存できます。</p></section>
</main><script>
(function(){
const $=id=>document.getElementById(id);const photoTypes=[['N','北'],['E','東'],['S','南'],['W','西'],['ALL','全景'],['SPHERE','全天球']];const photoState={};let treeCount=0;
function id(){return ($('plotId').value.trim()||'ID').replace(/[^a-zA-Z0-9_-]/g,'_')}
function drawPhotos(){const root=$('photoGrid');photoTypes.forEach(([key,label])=>{const d=document.createElement('div');d.className='photo';d.innerHTML='<b>'+label+'方向</b><div class="fname">'+id()+'_'+key+'.jpg</div><input type="file" accept="image/*" capture="environment" hidden><button type="button">📷 撮影</button><div class="status">未撮影</div>';const inp=d.querySelector('input'),btn=d.querySelector('button'),status=d.querySelector('.status');btn.onclick=()=>inp.click();inp.onchange=()=>{if(inp.files&&inp.files[0]){photoState[key]=inp.files[0];status.textContent='✓ 撮影済み（ファイル選択済み）'}};root.appendChild(d)});}
$('plotId').addEventListener('input',()=>document.querySelectorAll('.fname').forEach((e,i)=>e.textContent=id()+'_'+photoTypes[i][0]+'.jpg'));
[['thinning','間伐'],['pest','病虫害'],['dead','枯損木'],['bending','根曲がり'],['deer','シカ痕跡']].forEach(([k,n])=>{$('env').insertAdjacentHTML('beforeend','<div><label>'+n+'</label><select id="'+k+'"><option value="">未選択</option><option>有</option><option>無</option></select></div>')});
function makeTree(no,rep){const d=document.createElement('div');d.className='tree';d.innerHTML='<div class="treehead"><b>'+(rep?'代表木':'調査木')+' No. '+no+'</b>'+(rep?'':'<button type="button" class="danger">削除</button>')+'</div><label>樹種</label><div class="species">'+[['S','スギ'],['H','ヒノキ'],['M','マツ'],['B','広葉樹']].map(([v,t])=>'<label><input type="radio" name="species_'+(rep?'r':'t')+no+'" value="'+v+'">'+t+'</label>').join('')+'</div><div class="grid" style="margin-top:9px"><div><label>その他の樹種名</label><input class="other"></div><div><label>胸高直径（cm）</label><input class="dbh" type="number" min="0" step="0.1"></div>'+(rep?'<div><label>樹高1回目（m）</label><input class="h1" type="number" step="0.1"></div><div><label>樹高2回目（m）</label><input class="h2" type="number" step="0.1"></div><div><label>生枝下高1回目（m）</label><input class="c1" type="number" step="0.1"></div><div><label>生枝下高2回目（m）</label><input class="c2" type="number" step="0.1"></div>':'')+'<div style="grid-column:1/-1"><label>備考</label><input class="note"></div></div><div class="checks"><label><input class="nonupper" type="checkbox">非上層木</label><label><input class="deadwood" type="checkbox">枯損木</label><label>境界木 <select class="boundary" style="width:70px"><option value="">なし</option><option>+</option><option>-</option></select></label></div>';
if(!rep)d.querySelector('button').onclick=()=>d.remove();return d}
for(let i=1;i<=12;i++)$('reps').appendChild(makeTree(i,true));
$('add').onclick=()=>{treeCount++;$('trees').appendChild(makeTree(treeCount+12,false))};
function trees(root){return Array.from($(root).children).map(d=>({number:d.querySelector('.treehead b').textContent,species:d.querySelector('input[type=radio]:checked')?.value||'',otherSpecies:d.querySelector('.other').value,dbh:d.querySelector('.dbh').value,height1:d.querySelector('.h1')?.value||'',height2:d.querySelector('.h2')?.value||'',clearHeight1:d.querySelector('.c1')?.value||'',clearHeight2:d.querySelector('.c2')?.value||'',note:d.querySelector('.note').value,nonUpper:d.querySelector('.nonupper').checked,deadwood:d.querySelector('.deadwood').checked,boundary:d.querySelector('.boundary').value}))}
function collect(){return {plotId:$('plotId').value,date:$('date').value,lat:$('lat').value,lon:$('lon').value,memo:$('memo').value,environment:Object.fromEntries(['thinning','pest','dead','bending','deer'].map(k=>[k,$(k).value])),photos:Object.fromEntries(photoTypes.map(([k])=>[k,!!photoState[k]])),representatives:trees('reps'),trees:trees('trees'),savedAt:new Date().toISOString()}}
$('save').onclick=()=>{if(!$('plotId').value.trim()){alert('プロット番号を入力してください');return}localStorage.setItem('forest_v3_'+id(),JSON.stringify(collect()));$('status').textContent='✓ 端末内に保存しました'};
$('export').onclick=()=>{const data=collect();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(id()||'plot')+'_data.json';a.click();URL.revokeObjectURL(a.href)};
drawPhotos();
})();
</script></body></html>
